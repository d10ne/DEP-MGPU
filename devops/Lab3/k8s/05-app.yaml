apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrm-routing-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routing-ui
  template:
    metadata:
      labels:
        app: routing-ui
    spec:
      serviceAccountName: osrm-sa 
      initContainers:
      - name: wait-for-db
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z db-service 5432; do echo waiting for db; sleep 2; done;']
      containers:
      - name: streamlit
        image: osrm-app:v1
        imagePullPolicy: Never
        command: ["streamlit", "run", "routing.py", "--server.port=8501", "--server.address=0.0.0.0"] 
        ports:
        - containerPort: 8501
        ports:
        - containerPort: 8501
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: db-secret
        volumeMounts:
        - name: shared-data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /healthz 
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8501
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  type: NodePort
  selector:
    app: routing-ui
  ports:
  - port: 8501
    targetPort: 8501
    nodePort: 30088