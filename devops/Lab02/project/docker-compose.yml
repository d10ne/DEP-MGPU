services:

  db:
    image: postgres:16-alpine
    container_name: osrm
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data       
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  loader:
    build:
      context: ./app
    container_name: osrm_loader
    entrypoint: ["python", "loader.py"]         
    env_file: .env
    depends_on:
      db:
        condition: service_healthy               
    volumes:
      - ./data:/data:ro                         
    networks:
      - backend-network

  dashboard:
    build:
      context: ./app
    container_name: osrm_dashboard
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully 
    ports:
      - "8501:8501"                                
    networks:
      - backend-network
    volumes:
      - ./data:/data:ro 

volumes:
  pg_data:

networks:
  backend-network:
    driver: bridge